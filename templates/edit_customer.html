{% extends 'layout.html' %}

{% block content %}
<h1 class="mt-5">Edit Customer</h1>
<form action="{{ url_for('edit_customer', customer_id=customer.id) }}" method="post">
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="coid">COID</label>
            <input type="text" class="form-control" id="coid" name="coid" value="{{ customer.coid }}" required>
        </div>
        <div class="form-group col-md-6">
            <label for="company_name">Company Name</label>
            <input type="text" class="form-control" id="company_name" name="company_name" value="{{ customer.company_name }}" required>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="short_name">Short Name</label>
            <input type="text" class="form-control" id="short_name" name="short_name" value="{{ customer.short_name or '' }}">
        </div>
        <div class="form-group col-md-6">
            <label for="contact_person">Contact Person</label>
            <input type="text" class="form-control" id="contact_person" name="contact_person" value="{{ customer.contact_person or '' }}">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="phone">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ customer.phone or '' }}">
        </div>
        <div class="form-group col-md-6">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ customer.email or '' }}">
        </div>
    </div>
    <div class="form-group">
        <label for="address_line1">Address Line 1</label>
        <input type="text" class="form-control" id="address_line1" name="address_line1" value="{{ customer.address_line1 or '' }}">
    </div>
    <div class="form-group">
        <label for="address_line2">Address Line 2</label>
        <input type="text" class="form-control" id="address_line2" name="address_line2" value="{{ customer.address_line2 or '' }}">
    </div>
    <div class="form-row">
        <div class="form-group col-md-6">
            <label for="city">City</label>
            <input type="text" class="form-control" id="city" name="city" value="{{ customer.city or '' }}">
        </div>
        <div class="form-group col-md-4">
            <label for="state">State</label>
            <input type="text" class="form-control" id="state" name="state" value="{{ customer.state or '' }}">
        </div>
        <div class="form-group col-md-2">
            <label for="postal_code">Postal Code</label>
            <input type="text" class="form-control" id="postal_code" name="postal_code" value="{{ customer.postal_code or '' }}">
        </div>
    </div>
    <div class="form-group">
        <label for="country">Country</label>
        <input type="text" class="form-control" id="country" name="country" value="{{ customer.country or '' }}">
    </div>
    <div class="form-group">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if customer.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">
                Active
            </label>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Update Customer</button>
</form>
{% endblock %}
